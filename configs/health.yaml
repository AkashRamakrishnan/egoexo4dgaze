# Health Relations: Tier-A gaze-in-mask fusion on exocentric GoPro frames.
# Shares the Ego-Exo4D raw dump with other scenarios; extracted output is separate.

egoexo_root: ./_downloads/egoexo4d
output_root: ./data_health

scenario:
  slug: health
  parent_task_id: 2000
  parent_task_name: Health

relations:
  train: annotations/relations_train.json
  val: annotations/relations_val.json

filters:
  drop_hand_tracks: true
  min_label_count: 1
  exo_cam_prefix: cam

gaze:
  prefer_personalized: true
  calib_min_quality: 1.0

head_detection:
  model: yolov8n.pt
  conf: 0.5
  head_fraction: 0.35

export:
  jpeg_quality: 92
  num_workers: 4

splits:
  ratios: [0.7, 0.15, 0.15]
  seed: 42

build:
  max_takes: null
  skip_frame_export: false
  skip_head_detection: false
