# Sample QA: 40 random Cooking images that receive a Tier-A label.
# Does not run the full MVP. Requires a completed 01_download.sh dump.
#
#   CONFIG=configs/cooking_sample40.yaml ./scripts/run_sample40.sh
#   sbatch --export=ALL,EGOEXO_ROOT=/deepstore/datasets/dmb/ComputerVision/information_retrieval/egotogaze/egoexo4d_raw \
#     run_sample40_egoexo4d.sbatch

egoexo_root: ./_downloads/egoexo4d
output_root: ./data_sample40

scenario:
  parent_task_id: 1000
  parent_task_name: Cooking

relations:
  train: annotations/relations_train.json
  val: annotations/relations_val.json

filters:
  drop_hand_tracks: true
  min_label_count: 1
  exo_cam_prefix: cam

gaze:
  prefer_personalized: true
  calib_min_quality: 1.0

head_detection:
  model: yolov8n.pt
  conf: 0.5
  head_fraction: 0.35

export:
  jpeg_quality: 92
  num_workers: 4

splits:
  ratios: [0.7, 0.15, 0.15]
  seed: 42

build:
  max_takes: 5
  max_tier_a_images: 40
  shuffle_seed: 42
  skip_frame_export: false
  skip_head_detection: true
